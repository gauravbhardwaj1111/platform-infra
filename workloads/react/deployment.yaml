apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-ui
  namespace: llm-ns

spec:
  replicas: 1

  selector:
    matchLabels:
      app: react-ui

  template:
    metadata:
      labels:
        app: react-ui

    spec:
      imagePullSecrets:
      - name: harbor-secret

      containers:
      - name: react-ui
        image: harbor.20-72-172-104.nip.io/react-ui/react-ui:v13
        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
