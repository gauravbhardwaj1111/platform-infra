apiVersion: apps/v1
kind: Deployment
 
metadata:
  name: react-ui
  namespace: llm-ns
 
spec:
  replicas: 1
 
  selector:
    matchLabels:
      app: react-ui
 
  template:
    metadata:
      labels:
        app: react-ui
 
    spec:
      containers:
      - name: react-ui
        image: gauravbhhardwaj1111/agentic-ai-react-ui:v1
        imagePullPolicy: Always
 
        ports:
        - containerPort: 80
 
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"