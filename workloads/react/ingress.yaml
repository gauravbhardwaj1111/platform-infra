apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: react-ingress
  namespace: llm-ns

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: react-service
                port:
                  number: 80