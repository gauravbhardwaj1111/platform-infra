apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres-timescaledb
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gauravbhardwaj1111/platform-infra.git
    targetRevision: main
    path: workloads/postgres-timescaledb

  destination:
    server: https://kubernetes.default.svc
    namespace: llm-ns

  syncPolicy:
    syncOptions:
      - CreateNamespace=true