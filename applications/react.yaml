apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: react
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gauravbhardwaj1111/platform-infra.git
    targetRevision: main
    path: workloads/react

  destination:
    server: https://kubernetes.default.svc
    namespace: llm-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true