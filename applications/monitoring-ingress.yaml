apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-ingress
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gauravbhardwaj1111/platform-infra.git
    targetRevision: main
    path: workloads/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true