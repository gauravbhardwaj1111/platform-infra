apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://charts.timescale.com
      chart: timescaledb-single
      targetRevision: 0.34.0

      helm:
        valueFiles:
          - $values/values/postgres/values.yaml

    - repoURL: https://github.com/gauravbhardwaj1111/platform-infra.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: llm-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true