grafana:
  adminPassword: admin123

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true

  ingress:
    enabled: true
    ingressClassName: nginx

    hosts:
      - 20-72-172-104.nip.io

    path: /grafana
    pathType: Prefix

  persistence:
    enabled: true
    size: 10Gi

prometheus:
  prometheusSpec:
    externalUrl: https://20-72-172-104.nip.io/prometheus
    routePrefix: /prometheus

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

  ingress:
    enabled: true
    ingressClassName: nginx

    hosts:
      - 20-72-172-104.nip.io

    paths:
      - /prometheus

    pathType: Prefix

  service:
    port: 9090

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true